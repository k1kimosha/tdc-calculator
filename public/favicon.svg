<svg class="brand-mark" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <!-- Квадрат с четко заданной заливкой -->
          <rect width="48" height="48" rx="8" fill="#0b1524"></rect>
          
          <!-- Для кругов принудительно пишем fill="none", чтобы они не закрашивались внутри черным -->
          <circle cx="24" cy="24" r="20" stroke="#3fd9c7" stroke-opacity="0.35" stroke-width="1" fill="none"></circle>
          <circle cx="24" cy="24" r="13" stroke="#3fd9c7" stroke-opacity="0.55" stroke-width="1" fill="none"></circle>
          <circle cx="24" cy="24" r="6" stroke="#3fd9c7" stroke-opacity="0.75" stroke-width="1" fill="none"></circle>
          <circle cx="24" cy="24" r="1.6" fill="#3fd9c7"></circle>
          <path d="M24 24 V6" stroke="#3fd9c7" stroke-linecap="round" stroke-width="1"></path>
          <circle cx="24" cy="5" r="1.8" fill="#3fd9c7"></circle>
</svg>
